term xterm-256color

font_family JetBrains Mono
bold_font JetBrains Mono Bold
italic_font JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic


bold_font auto
italic_font auto
line_height 1.2

font_size 15.5
modify_font cell_height 120%
modify_font strikethrough_position 150%


include ~/.config/kitty/themes/catppuccin/themes/mocha.conf

cursor_trail 1
cursor_blink_interval 0
window_padding_width 0 0 0 0
hide_window_decorations yes
wayland_titlebar_color background
remember_window_size yes
initial_window_width 1680
initial_window_height 1200
enable_audio_bell no
macos_option_as_alt yes
shell_integration enabled
allow_hyperlinks yes
editor /Users/rodrigocruz/.local/share/bob/nvim-bin/nvim

tab_bar_style powerline

window_border_width 0.5pt
window_resize_step_cells 2
window_resize_step_lines 2
draw_minimal_borders yes
inactive_text_alpha 0.7
macos_titlebar_color background
macos_thicken_font 0.30
copy_on_select yes
active_border_color none
map alt+c none
scrollback_lines 100000

# BEGIN_KITTY_THEME
# include current-theme.conf
# END_KITTY_THEME

set_env EDITOR nvim

# map ctrl+j kitten pass_keys.py bottom ctrl+j
# map ctrl+k kitten pass_keys.py top    ctrl+k
# map ctrl+h kitten pass_keys.py left   ctrl+h
# map ctrl+l kitten pass_keys.py right  ctrl+l
# map ctrl+= launch --location=hsplit
# map ctrl+\ launch --location=vsplit

### Layout operations ###
# stack layout behaves the same as tmux pane zoom
# enabled_layouts splits,stack
# map ctrl+f>z toggle_layout stack
# map ctrl+f>space layout_action rotate

### Tab operations, corresponds to tmux window ###
# map ctrl+f>h launch --location=hsplit
# map ctrl+f>v launch --location=vsplit
# map ctrl+f>c new_tab
# map ctrl+f>s new_tab_with_cwd

env BIN_PATH=/opt/homebrew/bin/

# map ctrl+f>l launch --type=overlay python3 ~/dotfiles/kitty/session_manager/quick_switcher.py

allow_remote_control yes
listen_on unix:/tmp/mykitty

# background_opacity 0.95
# background #282C34

map ctrl+i launch --type=overlay --stdin-source=@screen_scrollback nvim -i NONE -R -c 'normal G' -c 'map q :q!<CR>' -c 'set clipboard=unnamedplus laststatus=0 nospell' -
